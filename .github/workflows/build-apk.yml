name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.47.7'
        channel: 'stable'
        cache: true
      
    - name: Create env.json with Groq API key
      run: echo '{"GROQ_API_KEY":"${{ secrets.GROQ_API_KEY }}"}' > env.json
      
    - name: Get dependencies
      run: flutter pub get
      
    - name: Build APK
      run: flutter build apk --release
      
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: cyberguard-apk
        path: build/app/outputs/flutter-apk/app-release.apk
        
    - name: Create Release
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: CyberGuard v1.0.${{ github.run_number }}
        body: |
          ## CyberGuard - Cyber Threat Detection App
          
          ### Developed by
          **AINEMBABAZI LAUBEN**
          23/BIT/013/UMR
          Metropolitan International University
          
          ### Features
          - 🛡️ AI-powered threat detection using Groq AI
          - 📱 Mobile money fraud detection
          - 🔗 Phishing link scanner
          - 💬 Cybersecurity AI agent
          - 📊 Community threat reports
          
          ### Download
          Download the APK below and install on your Android device.
        files: build/app/outputs/flutter-apk/app-release.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
