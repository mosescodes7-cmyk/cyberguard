name: cyberguard
description: Mobile-based cyber threat detection and awareness for Mbarara City.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  firebase_messaging: any
  provider: any
  http: any
  shared_preferences: any
  file_picker: ^8.3.7
  url_launcher: any
  device_preview: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  flutter_launcher_icons: any

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#1a1a2e"
    theme_color: "#00d9ff"
  windows:
    generate: true
    image_path: "assets/images/logo.png"
    icon_size: 48

